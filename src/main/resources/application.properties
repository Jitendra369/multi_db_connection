spring.application.name=multipleDBConnect


#postgry db connection
spring.datasource.primary.jdbc-url=jdbc:postgresql://localhost:5432/muldb
spring.datasource.primary.username=postgres
spring.datasource.primary.password=root
spring.datasource.primary.driver-class-name=org.postgresql.Driver
#springdoc.api-docs.path=/api-docs


# mysql DB connection
spring.datasource.secondary.jdbc-url=jdbc:mysql://localhost:3306/muldb
spring.datasource.secondary.username=root
spring.datasource.secondary.password=root
spring.datasource.secondary.driver-class-name=com.mysql.cj.jdbc.Driver



